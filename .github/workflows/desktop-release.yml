name: Desktop Release

on:
  push:
    tags:
      - "v*" # 推送 v1.0.0 格式的 tag 时自动触发
  workflow_dispatch: # 允许在 GitHub Actions 面板手动触发
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0) - Leave empty to build only without creating release'
        required: false
        type: string

jobs:
  build:
    name: Build Windows x64 Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate static frontend
        working-directory: Business/ReferenceRAG.Business/wwwroot
        run: |
          node check.mjs
          node --test tests/*.test.mjs

      - name: Restore dependencies
        run: dotnet restore ReferenceRAG.slnx

      - name: Publish Desktop App
        run: >
          dotnet publish Host/ReferenceRAG.DesktopHost/ReferenceRAG.DesktopHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -o support/artifacts/publish/desktop

      - name: Archive production artifacts
        run: Compress-Archive -Path support/artifacts/publish/desktop\* -DestinationPath support/artifacts/publish/ReferenceRAG-win-x64.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReferenceRAG-win-x64
          path: support/artifacts/publish/ReferenceRAG-win-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    # Tag 推送或手动触发且填写版本号时创建 release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: support/artifacts/downloads

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: support/artifacts/downloads/*/*
          generate_release_notes: true
          body: |
            🎉 **ReferenceRAG Windows 桌面版更新发布**

            本次发布包含适用于 Windows x64 的独立运行桌面程序。
            **无需安装 .NET 运行时**，下载解压即可直接运行！

            ### 📦 下载与运行指南

            * **🪟 Windows x64**:
                * 下载 `ReferenceRAG-win-x64.zip`。
                * 解压后双击运行 `ReferenceRAG.DesktopHost.exe`。
                * 首次运行需安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2)（Edge 浏览器已含此组件）。

            ---

            *💡 详细代码更新日志请参考下方自动生成的 Release Notes 👇*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
