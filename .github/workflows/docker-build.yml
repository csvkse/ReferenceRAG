name: Docker Build & Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    paths:
      - "support/deploy/docker/**"
      - "support/config/examples/appsettings.Docker.example.json"
      - "support/config/appsettings.template.json"
      - "Host/ReferenceRAG.WebHost/**"
      - "Host/ReferenceRAG.ApiHost/**"
      - "Business/**"
      - "Infrastructure/**"
      - "Directory.*.props"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "构建变体 (cpu / cuda / nvidia / rocm / amd / intel / all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cpu
          - cuda
          - nvidia
          - rocm
          - amd
          - intel
      push_image:
        description: "是否推送镜像至 GHCR"
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-variants.outputs.variants }}
      should_push: ${{ steps.set-variants.outputs.should_push }}
    steps:
      - name: Determine variants and push policy
        id: set-variants
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'variants=["cpu"]' >> "$GITHUB_OUTPUT"
            echo 'should_push=false' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.variant }}" = "all" ]; then
              echo 'variants=["cpu","cuda","rocm","intel"]' >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.variant }}" = "nvidia" ]; then
              echo 'variants=["cuda"]' >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.variant }}" = "amd" ]; then
              echo 'variants=["rocm"]' >> "$GITHUB_OUTPUT"
            else
              echo 'variants=["${{ inputs.variant }}"]' >> "$GITHUB_OUTPUT"
            fi
            echo 'should_push=${{ inputs.push_image }}' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["cpu","cuda","rocm","intel"]' >> "$GITHUB_OUTPUT"
            echo 'should_push=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.variant }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free Disk Space (for GPU / compute images)
        if: matrix.variant != 'cpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Latest TemporaryDiagnostics Packages
        shell: bash
        run: |
          chmod +x support/tools/scripts/sync-temporary-diagnostics.sh
          support/tools/scripts/sync-temporary-diagnostics.sh --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Set lower case repository name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. CPU / Universal 元数据提取 (唯一拥有 latest 标签)
      - name: Extract Docker metadata (CPU)
        id: meta_cpu
        if: matrix.variant == 'cpu'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=cpu,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      # 2. NVIDIA CUDA 元数据提取 (严格禁用 latest 避免覆盖通用镜像)
      - name: Extract Docker metadata (NVIDIA CUDA)
        id: meta_cuda
        if: matrix.variant == 'cuda'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-cuda
            type=semver,pattern={{major}}.{{minor}},suffix=-cuda
            type=sha,format=short,suffix=-cuda
            type=raw,value=cuda,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=cuda-12.8,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=nvidia,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      # 3. AMD ROCm 元数据提取 (严格禁用 latest 避免覆盖通用镜像)
      - name: Extract Docker metadata (AMD ROCm)
        id: meta_rocm
        if: matrix.variant == 'rocm'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-rocm
            type=semver,pattern={{major}}.{{minor}},suffix=-rocm
            type=sha,format=short,suffix=-rocm
            type=raw,value=rocm,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=amd,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      # 4. Intel GPU 元数据提取 (严格禁用 latest 避免覆盖通用镜像)
      - name: Extract Docker metadata (Intel GPU)
        id: meta_intel
        if: matrix.variant == 'intel'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-intel
            type=semver,pattern={{major}}.{{minor}},suffix=-intel
            type=sha,format=short,suffix=-intel
            type=raw,value=intel,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=openvino,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      # 5. 动态选择 Dockerfile 与 Meta
      - name: Determine Dockerfile and Tags
        id: select_target
        run: |
          case "${{ matrix.variant }}" in
            cuda)
              DOCKERFILE="support/deploy/docker/Dockerfile.cuda"
              TAGS="${{ steps.meta_cuda.outputs.tags }}"
              LABELS="${{ steps.meta_cuda.outputs.labels }}"
              ;;
            rocm)
              DOCKERFILE="support/deploy/docker/Dockerfile.rocm"
              TAGS="${{ steps.meta_rocm.outputs.tags }}"
              LABELS="${{ steps.meta_rocm.outputs.labels }}"
              ;;
            intel)
              DOCKERFILE="support/deploy/docker/Dockerfile.intel"
              TAGS="${{ steps.meta_intel.outputs.tags }}"
              LABELS="${{ steps.meta_intel.outputs.labels }}"
              ;;
            *)
              DOCKERFILE="support/deploy/docker/Dockerfile"
              TAGS="${{ steps.meta_cpu.outputs.tags }}"
              LABELS="${{ steps.meta_cpu.outputs.labels }}"
              ;;
          esac

          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "labels<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LABELS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.select_target.outputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.should_push == 'true' }}
          tags: ${{ steps.select_target.outputs.tags }}
          labels: ${{ steps.select_target.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}
