name: Docker Build & Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    paths:
      - "support/deploy/docker/**"
      - "support/config/examples/appsettings.Docker.example.json"
      - "Host/ReferenceRAG.WebHost/**"
      - "Host/ReferenceRAG.ApiHost/**"
      - "Business/**"
      - "Infrastructure/**"
      - "Directory.*.props"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "构建变体 (cpu / gpu / all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cpu
          - gpu
      push_image:
        description: "是否推送镜像至 GHCR"
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-variants.outputs.variants }}
      should_push: ${{ steps.set-variants.outputs.should_push }}
    steps:
      - name: Determine variants and push policy
        id: set-variants
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'variants=["cpu"]' >> "$GITHUB_OUTPUT"
            echo 'should_push=false' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.variant }}" = "all" ]; then
              echo 'variants=["cpu","gpu"]' >> "$GITHUB_OUTPUT"
            else
              echo 'variants=["${{ inputs.variant }}"]' >> "$GITHUB_OUTPUT"
            fi
            echo 'should_push=${{ inputs.push_image }}' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["cpu","gpu"]' >> "$GITHUB_OUTPUT"
            echo 'should_push=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.variant }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free Disk Space (for GPU CUDA image)
        if: matrix.variant == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (CPU)
        id: meta_cpu
        if: matrix.variant == 'cpu'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      - name: Extract Docker metadata (GPU)
        id: meta_gpu
        if: matrix.variant == 'gpu'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-gpu
            type=semver,pattern={{major}}.{{minor}},suffix=-gpu
            type=sha,format=short,suffix=-gpu
            type=raw,value=gpu,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant == 'gpu' && 'support/deploy/docker/Dockerfile.gpu' || 'support/deploy/docker/Dockerfile' }}
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.should_push == 'true' }}
          tags: ${{ matrix.variant == 'gpu' && steps.meta_gpu.outputs.tags || steps.meta_cpu.outputs.tags }}
          labels: ${{ matrix.variant == 'gpu' && steps.meta_gpu.outputs.labels || steps.meta_cpu.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}
